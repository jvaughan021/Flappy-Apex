<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Apex - Created by Jack vaughan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0d14;
            color: #ffffff;
            overflow: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Glassmorphism card effects */
        .glass-card {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.2);
        }

        /* Glowing text effect */
        .glow-text {
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.6), 0 0 30px rgba(99, 102, 241, 0.4);
        }

        /* Button pulsing animation */
        .pulse-btn {
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px rgba(244, 63, 94, 0.4), 0 0 30px rgba(99, 102, 241, 0.3);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 25px rgba(244, 63, 94, 0.8), 0 0 50px rgba(99, 102, 241, 0.6);
                transform: scale(1.02);
            }
        }

        /* Screen flash on crash */
        .flash-overlay {
            position: absolute;
            inset: 0;
            background-color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease-out;
            z-index: 50;
        }

        /* Score pop effect */
        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); color: #f43f5e; }
            100% { transform: scale(1); }
        }

        .pop-score {
            animation: scorePop 0.25s ease-out;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center p-0 m-0 bg-slate-950 select-none overflow-hidden">

    <div id="gameContainer" class="relative w-full h-full max-w-md max-h-[920px] aspect-[9/16] bg-slate-900 shadow-2xl overflow-hidden flex flex-col justify-between sm:rounded-3xl border-0 sm:border-2 border-slate-800/80">
        
        <!-- Game Canvas -->
        <canvas id="gameCanvas" class="absolute inset-0 w-full h-full z-0 cursor-pointer block"></canvas>

        <!-- Flash Effect Overlay -->
        <div id="flashOverlay" class="flash-overlay"></div>

        <!-- Active Gameplay HUD (NO CREATOR TAG HERE - ONLY SCORE & BEST SCORE) -->
        <div id="hud" class="relative z-10 p-4 flex justify-between items-center pointer-events-none transition-opacity duration-300 opacity-0">
            <div class="flex items-center space-x-2 bg-slate-900/85 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-slate-700/50">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Best</span>
                <span id="hudBestScore" class="font-orbitron text-sm font-extrabold text-amber-400">0</span>
            </div>
            <div class="bg-slate-900/85 backdrop-blur-md px-4 py-1.5 rounded-full border border-slate-700/50">
                <span id="hudCurrentScore" class="font-orbitron text-2xl font-black text-white">0</span>
            </div>
        </div>

        <!-- Start Screen Overlay -->
        <div id="startScreen" class="absolute inset-0 z-20 flex flex-col items-center justify-between p-6 bg-slate-950/75 backdrop-blur-sm text-center">
            <div class="mt-8 flex flex-col items-center">
                <div class="inline-block px-3 py-1 mb-2 bg-indigo-500/20 rounded-full border border-indigo-500/40 text-indigo-300 text-xs font-bold tracking-widest uppercase">
                    Arcade Mobile Edition
                </div>
                <h1 class="font-orbitron text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-br from-rose-500 via-purple-400 to-indigo-400 glow-text mb-1">
                    FLAPPY APEX
                </h1>
                <p class="text-sm font-bold tracking-wide text-rose-400">
                    Created by Jack vaughan
                </p>
            </div>

            <!-- Animated Rocket Icon -->
            <div class="my-auto flex flex-col items-center space-y-4">
                <div class="relative w-24 h-24 flex items-center justify-center">
                    <div class="absolute inset-0 rounded-full bg-rose-500/20 animate-ping"></div>
                    <div class="relative w-20 h-20 rounded-2xl bg-gradient-to-tr from-rose-600 via-indigo-600 to-cyan-400 p-0.5 shadow-xl transform rotate-6">
                        <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center overflow-hidden">
                            <span class="text-4xl transform -rotate-6">🚀</span>
                        </div>
                    </div>
                </div>
                <p class="text-xs text-slate-300 max-w-[220px] leading-relaxed">
                    Tap anywhere on the screen to flap your thrusters and navigate the apex obstacles!
                </p>
            </div>

            <!-- Start Button -->
            <div class="w-full max-w-xs mb-6">
                <button id="startBtn" class="pulse-btn w-full py-4 rounded-2xl bg-gradient-to-r from-rose-500 via-indigo-600 to-purple-600 font-orbitron font-extrabold text-lg tracking-wider text-white shadow-xl active:scale-95 transition-transform duration-100">
                    TAP TO PLAY
                </button>
            </div>
        </div>

        <!-- Game Over Screen Overlay -->
        <div id="gameOverScreen" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-6 bg-slate-950/85 backdrop-blur-md text-center hidden">
            <div class="glass-card w-full max-w-xs p-6 rounded-3xl flex flex-col items-center space-y-5 border border-slate-700/60 shadow-2xl">
                
                <div class="flex flex-col items-center">
                    <span class="text-xs font-bold text-rose-400 uppercase tracking-widest mb-1">Game Over</span>
                    <h2 class="font-orbitron text-3xl font-black text-white">APEX CRASH</h2>
                </div>

                <!-- Score Board -->
                <div class="w-full bg-slate-900/90 rounded-2xl p-4 border border-slate-800/80 flex flex-col space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Score</span>
                        <span id="finalScore" class="font-orbitron text-2xl font-black text-rose-400">0</span>
                    </div>
                    <div class="w-full h-[1px] bg-slate-800"></div>
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold text-slate-400 uppercase">Best Score</span>
                        <span id="bestScore" class="font-orbitron text-2xl font-black text-amber-400">0</span>
                    </div>
                </div>

                <!-- High Score Record Badge -->
                <div id="newRecordBadge" class="hidden px-3 py-1 bg-gradient-to-r from-amber-500 to-rose-500 rounded-full text-slate-950 font-orbitron text-xs font-black tracking-wider uppercase shadow-lg animate-bounce">
                    ★ NEW HIGH SCORE ★
                </div>

                <!-- Creator Credit -->
                <p class="text-xs text-slate-300 font-bold">
                    Created by Jack vaughan
                </p>

                <!-- Restart Button -->
                <button id="restartBtn" class="pulse-btn w-full py-3.5 rounded-xl bg-gradient-to-r from-rose-500 via-indigo-600 to-purple-600 font-orbitron font-extrabold text-base tracking-wider text-white shadow-lg active:scale-95 transition-transform duration-100">
                    PLAY AGAIN
                </button>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI References
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const hud = document.getElementById('hud');
        const hudCurrentScore = document.getElementById('hudCurrentScore');
        const hudBestScore = document.getElementById('hudBestScore');
        const finalScoreEl = document.getElementById('finalScore');
        const bestScoreEl = document.getElementById('bestScore');
        const newRecordBadge = document.getElementById('newRecordBadge');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const flashOverlay = document.getElementById('flashOverlay');
        const gameContainer = document.getElementById('gameContainer');

        // Game Variables
        let gameState = 'START';
        let animationFrameId = null;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flappyApex_highScore') || '0', 10);
        let screenShakeTime = 0;

        hudBestScore.textContent = highScore;

        // Virtual Resolution Specs
        const V_WIDTH = 360;
        const V_HEIGHT = 640;
        let scale = 1;

        function resizeCanvas() {
            const rect = gameContainer.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            scale = canvas.width / V_WIDTH;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const player = {
            x: 70,
            y: V_HEIGHT / 2 - 15,
            width: 32,
            height: 32,
            gravity: 0.25,        // Soft gravity
            jumpStrength: -5.8,   // Forgiving jump impulse
            velocity: 0,
            rotation: 0,
            particles: [],

            reset() {
                this.y = V_HEIGHT / 2 - 15;
                this.velocity = 0;
                this.rotation = 0;
                this.particles = [];
            },

            jump() {
                if (gameState !== 'PLAYING') return;
                this.velocity = this.jumpStrength;
                
                // Spawn jump flame particles
                for (let i = 0; i < 6; i++) {
                    this.particles.push({
                        x: this.x - 5,
                        y: this.y + this.height / 2,
                        vx: - (Math.random() * 2 + 1),
                        vy: (Math.random() - 0.5) * 2,
                        size: Math.random() * 4 + 2,
                        color: Math.random() > 0.5 ? '#f43f5e' : '#fb923c',
                        alpha: 1,
                        decay: Math.random() * 0.05 + 0.02
                    });
                }
            },

            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                // Rotation calculation
                this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 5, this.velocity * 0.08));

                // Particles update
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            },

            draw() {
                // Particles
                this.particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x * scale, p.y * scale, p.size * scale, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // Player Rocket Avatar
                ctx.save();
                ctx.translate((this.x + this.width / 2) * scale, (this.y + this.height / 2) * scale);
                ctx.rotate(this.rotation);

                const w = this.width * scale;
                const h = this.height * scale;

                const bodyGradient = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
                bodyGradient.addColorStop(0, '#f43f5e');
                bodyGradient.addColorStop(0.5, '#8b5cf6');
                bodyGradient.addColorStop(1, '#3b82f6');

                ctx.fillStyle = bodyGradient;
                ctx.beginPath();
                ctx.roundRect(-w/2, -h/2, w, h, 8 * scale);
                ctx.fill();

                // Window
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(w * 0.15, -h * 0.1, 5 * scale, 0, Math.PI * 2);
                ctx.fill();

                // Thruster Flame
                if (gameState === 'PLAYING') {
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.moveTo(-w/2, -h*0.2);
                    ctx.lineTo(-w/2 - (Math.random() * 8 + 4) * scale, 0);
                    ctx.lineTo(-w/2, h*0.2);
                    ctx.closePath();
                    ctx.fill();
                }

                ctx.restore();
            }
        };

        const background = {
            clouds: [
                { x: 40, y: 50, scale: 0.8, speed: 0.3 },
                { x: 200, y: 90, scale: 1.2, speed: 0.5 },
                { x: 320, y: 40, scale: 0.6, speed: 0.2 }
            ],

            update() {
                if (gameState === 'GAMEOVER') return;
                this.clouds.forEach(c => {
                    c.x -= c.speed;
                    if (c.x < -80) c.x = V_WIDTH + 40;
                });
            },

            draw() {
                const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                skyGradient.addColorStop(0, '#0f172a');
                skyGradient.addColorStop(0.5, '#1e1b4b');
                skyGradient.addColorStop(1, '#311042');
                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                this.clouds.forEach(c => {
                    const cx = c.x * scale;
                    const cy = c.y * scale;
                    const cs = c.scale * scale;

                    ctx.beginPath();
                    ctx.arc(cx, cy, 20 * cs, 0, Math.PI * 2);
                    ctx.arc(cx + 15 * cs, cy - 10 * cs, 25 * cs, 0, Math.PI * 2);
                    ctx.arc(cx + 35 * cs, cy, 20 * cs, 0, Math.PI * 2);
                    ctx.fill();
                });

                ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                ctx.lineTo(0, canvas.height - 100 * scale);
                ctx.lineTo(80 * scale, canvas.height - 160 * scale);
                ctx.lineTo(180 * scale, canvas.height - 110 * scale);
                ctx.lineTo(260 * scale, canvas.height - 180 * scale);
                ctx.lineTo(V_WIDTH * scale, canvas.height - 90 * scale);
                ctx.lineTo(V_WIDTH * scale, canvas.height);
                ctx.fill();
            }
        };

        const obstacles = {
            pipes: [],
            pipeWidth: 50,
            pipeGap: 195,        // Extra wide gap height for forgiving navigation
            spawnTimer: 0,
            spawnInterval: 125,
            speed: 1.8,
            reset() {
                this.pipes = [];
                this.spawnTimer = 0;
            },

            update() {
                if (gameState !== 'PLAYING') return;

                this.spawnTimer++;
                if (this.spawnTimer >= this.spawnInterval) {
                    this.spawnTimer = 0;

                    const minHeight = 45;
                    const maxHeight = V_HEIGHT - this.pipeGap - 90;
                    const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

                    this.pipes.push({
                        x: V_WIDTH,
                        topHeight: topHeight,
                        bottomY: topHeight + this.pipeGap,
                        passed: false
                    });
                }

                for (let i = this.pipes.length - 1; i >= 0; i--) {
                    const pipe = this.pipes[i];
                    pipe.x -= this.speed;

                    if (!pipe.passed && pipe.x + this.pipeWidth < player.x) {
                        pipe.passed = true;
                        incrementScore();
                    }

                    if (pipe.x < -this.pipeWidth) {
                        this.pipes.splice(i, 1);
                    }
                }
            },

            draw() {
                this.pipes.forEach(pipe => {
                    const px = pipe.x * scale;
                    const pw = this.pipeWidth * scale;
                    const topH = pipe.topHeight * scale;
                    const botY = pipe.bottomY * scale;
                    const botH = (V_HEIGHT - pipe.bottomY) * scale;

                    const pipeGradient = ctx.createLinearGradient(px, 0, px + pw, 0);
                    pipeGradient.addColorStop(0, '#1e293b');
                    pipeGradient.addColorStop(0.3, '#334155');
                    pipeGradient.addColorStop(0.7, '#475569');
                    pipeGradient.addColorStop(1, '#0f172a');

                    const rimGradient = ctx.createLinearGradient(px, 0, px + pw, 0);
                    rimGradient.addColorStop(0, '#f43f5e');
                    rimGradient.addColorStop(1, '#6366f1');

                    // Top Pipe
                    ctx.fillStyle = pipeGradient;
                    ctx.fillRect(px, 0, pw, topH);
                    ctx.fillStyle = rimGradient;
                    ctx.fillRect(px - 3 * scale, topH - 14 * scale, pw + 6 * scale, 14 * scale);

                    // Bottom Pipe
                    ctx.fillStyle = pipeGradient;
                    ctx.fillRect(px, botY, pw, botH);
                    ctx.fillStyle = rimGradient;
                    ctx.fillRect(px - 3 * scale, botY, pw + 6 * scale, 14 * scale);
                });
            }
        };

        function incrementScore() {
            score++;
            hudCurrentScore.textContent = score;

            hudCurrentScore.classList.remove('pop-score');
            void hudCurrentScore.offsetWidth;
            hudCurrentScore.classList.add('pop-score');
        }

        function checkCollisions() {
            if (player.y <= 0 || player.y + player.height >= V_HEIGHT) {
                triggerGameOver();
                return;
            }

            const hitboxPadding = 8;
            for (let i = 0; i < obstacles.pipes.length; i++) {
                const pipe = obstacles.pipes[i];
                const pBox = {
                    left: player.x + hitboxPadding,
                    right: player.x + player.width - hitboxPadding,
                    top: player.y + hitboxPadding,
                    bottom: player.y + player.height - hitboxPadding
                };

                const topPipeBox = {
                    left: pipe.x,
                    right: pipe.x + obstacles.pipeWidth,
                    top: 0,
                    bottom: pipe.topHeight
                };

                const bottomPipeBox = {
                    left: pipe.x,
                    right: pipe.x + obstacles.pipeWidth,
                    top: pipe.bottomY,
                    bottom: V_HEIGHT
                };

                if (rectsIntersect(pBox, topPipeBox) || rectsIntersect(pBox, bottomPipeBox)) {
                    triggerGameOver();
                    return;
                }
            }
        }

        function rectsIntersect(r1, r2) {
            return !(r2.left > r1.right || 
                     r2.right < r1.left || 
                     r2.top > r1.bottom || 
                     r2.bottom < r1.top);
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            screenShakeTime = 15;

            flashOverlay.style.opacity = '0.8';
            setTimeout(() => {
                flashOverlay.style.opacity = '0';
            }, 100);

            let isNewHigh = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappyApex_highScore', highScore);
                isNewHigh = true;
            }

            finalScoreEl.textContent = score;
            bestScoreEl.textContent = highScore;
            hudBestScore.textContent = highScore;

            if (isNewHigh && score > 0) {
                newRecordBadge.classList.remove('hidden');
            } else {
                newRecordBadge.classList.add('hidden');
            }

            setTimeout(() => {
                hud.classList.add('opacity-0');
                gameOverScreen.classList.remove('hidden');
            }, 300);
        }

        function startNewGame() {
            score = 0;
            hudCurrentScore.textContent = '0';
            player.reset();
            obstacles.reset();

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            hud.classList.remove('opacity-0');

            gameState = 'PLAYING';
            player.jump();
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            if (screenShakeTime > 0) {
                const shakeX = (Math.random() - 0.5) * 12;
                const shakeY = (Math.random() - 0.5) * 12;
                ctx.translate(shakeX, shakeY);
                screenShakeTime--;
            }

            background.update();
            obstacles.update();
            if (gameState === 'PLAYING') {
                player.update();
                checkCollisions();
            }

            background.draw();
            obstacles.draw();
            player.draw();

            ctx.restore();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function handleUserAction(e) {
            if (e.type === 'touchstart' && e.cancelable) {
                e.preventDefault();
            }

            if (gameState === 'START') {
                startNewGame();
            } else if (gameState === 'PLAYING') {
                player.jump();
            }
        }

        canvas.addEventListener('touchstart', handleUserAction, { passive: false });
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) handleUserAction(e);
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                if (gameState === 'START') {
                    startNewGame();
                } else if (gameState === 'PLAYING') {
                    player.jump();
                } else if (gameState === 'GAMEOVER' && !gameOverScreen.classList.contains('hidden')) {
                    startNewGame();
                }
            }
        });

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startNewGame();
        });

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startNewGame();
        });

        window.onload = function() {
            resizeCanvas();
            gameLoop();
        };
    </script>
</body>
</html>
