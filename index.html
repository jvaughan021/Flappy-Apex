<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Apex - Created by Jack vaughan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0d14;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.2);
        }

        .glow-text {
            text-shadow: 0 0 15px rgba(244, 63, 94, 0.6), 0 0 30px rgba(99, 102, 241, 0.4);
        }

        .pulse-btn {
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 15px rgba(244, 63, 94, 0.4), 0 0 30px rgba(99, 102, 241, 0.3);
                transform: scale(1);
            }
            100% {
                box-shadow: 0 0 25px rgba(244, 63, 94, 0.8), 0 0 50px rgba(99, 102, 241, 0.6);
                transform: scale(1.02);
            }
        }

        .flash-overlay {
            position: absolute;
            inset: 0;
            background-color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease-out;
            z-index: 50;
        }

        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); color: #f43f5e; }
            100% { transform: scale(1); }
        }

        .pop-score {
            animation: scorePop 0.25s ease-out;
        }

        /* Custom Scrollbar for Leaderboard */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="gameContainer" class="relative w-full h-full max-w-md max-h-full sm:max-h-[920px] aspect-[9/16] bg-slate-900 shadow-2xl overflow-hidden flex flex-col justify-between sm:rounded-3xl border-0 sm:border-2 border-slate-800/80">
        
        <!-- Game Area Wrapper -->
        <div class="relative w-full flex-1 overflow-hidden">
            <!-- Game Canvas -->
            <canvas id="gameCanvas" class="absolute inset-0 w-full h-full z-0 cursor-pointer block"></canvas>

            <!-- Flash Effect Overlay -->
            <div id="flashOverlay" class="flash-overlay"></div>

            <!-- Active Gameplay HUD -->
            <div id="hud" class="relative z-10 p-4 flex justify-between items-center pointer-events-none transition-opacity duration-300 opacity-0">
                <div class="flex items-center space-x-2 bg-slate-900/85 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-slate-700/50">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Best</span>
                    <span id="hudBestScore" class="font-orbitron text-sm font-extrabold text-amber-400">0</span>
                </div>
                <div class="bg-slate-900/85 backdrop-blur-md px-4 py-1.5 rounded-full border border-slate-700/50">
                    <span id="hudCurrentScore" class="font-orbitron text-2xl font-black text-white">0</span>
                </div>
            </div>

            <!-- Nickname Registration Overlay (First Launch) -->
            <div id="nicknameScreen" class="absolute inset-0 z-30 flex flex-col items-center justify-center p-3 bg-slate-950/90 backdrop-blur-md text-center hidden">
                <div class="glass-card w-full max-w-xs p-4 rounded-3xl flex flex-col items-center space-y-3 border border-slate-700/60 shadow-2xl max-h-[98vh] overflow-y-auto pointer-events-auto">
                    <div class="inline-block px-2.5 py-0.5 bg-indigo-500/20 rounded-full border border-indigo-500/40 text-indigo-300 text-[10px] font-bold tracking-widest uppercase">
                        Secure Leaderboard
                    </div>
                    <h2 class="font-orbitron text-base font-black text-white">CHOOSE HANDLE</h2>
                    <p class="text-[10px] text-slate-300 leading-relaxed">
                        Pick a unique nickname to lock your global scores.
                    </p>
                    <div class="w-full space-y-1">
                        <input type="text" id="nicknameInput" maxlength="14" placeholder="Enter nickname..." class="w-full px-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-white font-orbitron text-xs text-center focus:outline-none focus:border-indigo-500 transition-colors">
                        <p id="nicknameError" class="text-[10px] text-rose-400 font-semibold h-3"></p>
                    </div>

                    <button id="saveNicknameBtn" class="pulse-btn w-full py-2.5 rounded-xl bg-gradient-to-r from-rose-500 via-indigo-600 to-purple-600 font-orbitron font-extrabold text-xs tracking-wider text-white shadow-lg active:scale-95 transition-transform duration-100 cursor-pointer">
                        CLAIM HANDLE & PLAY
                    </button>
                </div>
            </div>

            <!-- Separate Leaderboard Modal Overlay -->
            <div id="leaderboardModal" class="absolute inset-0 z-40 flex flex-col items-center justify-center p-6 bg-slate-950/90 backdrop-blur-md text-center hidden">
                <div class="glass-card w-full max-w-xs p-5 rounded-3xl flex flex-col items-center space-y-4 border border-slate-700/60 shadow-2xl pointer-events-auto">
                    <div class="flex flex-col items-center">
                        <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">Global Standings</span>
                        <h2 class="font-orbitron text-2xl font-black text-white">TOP PILOTS</h2>
                    </div>
                    
                    <!-- Full Rankings Container -->
                    <div id="modalLeaderboardList" class="w-full bg-slate-900/90 rounded-2xl p-3 border border-slate-800/80 max-h-[280px] overflow-y-auto space-y-2 text-xs">
                        <div class="text-slate-500 text-center py-4 text-xs">Loading rankings...</div>
                    </div>

                    <button id="closeLeaderboardBtn" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 font-orbitron font-bold text-xs tracking-wider text-slate-300 border border-slate-700/50 active:scale-95 transition-all cursor-pointer">
                        BACK
                    </button>
                </div>
            </div>

            <!-- Start Screen Overlay -->
            <div id="startScreen" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-6 bg-slate-950/75 backdrop-blur-sm text-center pointer-events-auto hidden">
                <div class="flex flex-col items-center mb-6">
                    <div class="inline-block px-3 py-1 mb-1 bg-indigo-500/20 rounded-full border border-indigo-500/40 text-indigo-300 text-xs font-bold tracking-widest uppercase">
                        Arcade Mobile Edition
                    </div>
                    <h1 class="font-orbitron text-4xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-br from-rose-500 via-purple-400 to-indigo-400 glow-text mb-0.5">
                        FLAPPY APEX
                    </h1>
                    <p class="text-xs font-bold tracking-wide text-rose-400 mb-2">
                        Created by Jack vaughan
                    </p>
                    <div class="flex items-center space-x-2 bg-slate-900/80 px-3 py-1 rounded-full border border-slate-700/50">
                        <span class="text-[11px] text-slate-400">Player:</span>
                        <span id="displayNickname" class="font-orbitron text-xs font-bold text-indigo-400">---</span>
                    </div>
                </div>

                <!-- Menu Action Buttons -->
                <div class="w-full max-w-xs space-y-3">
                    <button id="startBtn" class="pulse-btn w-full py-3.5 rounded-2xl bg-gradient-to-r from-rose-500 via-indigo-600 to-purple-600 font-orbitron font-extrabold text-lg tracking-wider text-white shadow-xl active:scale-95 transition-transform duration-100 cursor-pointer">
                        TAP TO PLAY
                    </button>
                    <button id="openLeaderboardStartBtn" class="w-full py-3 rounded-xl bg-slate-900/90 hover:bg-slate-800 font-orbitron font-bold text-sm tracking-wider text-indigo-300 border border-indigo-500/30 shadow-md active:scale-95 transition-all cursor-pointer">
                        VIEW LEADERBOARD
                    </button>
                </div>
            </div>

            <!-- Game Over Screen Overlay (Hidden via display:none by default) -->
            <div id="gameOverScreen" class="absolute inset-0 z-20 flex-col items-center justify-center p-2 bg-slate-950/85 backdrop-blur-md text-center opacity-0 pointer-events-none transition-opacity duration-300" style="display: none;">
                <div class="glass-card w-full max-w-xs p-3 rounded-3xl flex flex-col items-center space-y-2 border border-slate-700/60 shadow-2xl overflow-y-auto max-h-[98vh] pointer-events-auto">
                    
                    <div class="flex flex-col items-center">
                        <span class="text-[9px] font-bold text-rose-400 uppercase tracking-widest">Game Over</span>
                        <h2 class="font-orbitron text-base font-black text-white">APEX CRASH</h2>
                    </div>

                    <!-- Score Board -->
                    <div class="w-full bg-slate-900/90 rounded-xl p-2 border border-slate-800/80 flex flex-col space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="text-[9px] font-semibold text-slate-400 uppercase">Score</span>
                            <span id="finalScore" class="font-orbitron text-sm font-black text-rose-400">0</span>
                        </div>
                        <div class="w-full h-[1px] bg-slate-800"></div>
                        <div class="flex justify-between items-center">
                            <span class="text-[9px] font-semibold text-slate-400 uppercase">Best Score</span>
                            <span id="bestScore" class="font-orbitron text-sm font-black text-amber-400">0</span>
                        </div>
                    </div>

                    <!-- High Score Record Badge -->
                    <div id="newRecordBadge" class="hidden px-2.5 py-0.5 bg-gradient-to-r from-amber-500 to-rose-500 rounded-full text-slate-950 font-orbitron text-[8px] font-black tracking-wider uppercase shadow-lg animate-bounce">
                        ★ NEW HIGH SCORE ★
                    </div>

                    <!-- SmartLink Rewarded Revive Button (Limited to 1 per game) -->
                    <button id="smartLinkReviveBtn" class="w-full py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 font-orbitron font-extrabold text-xs tracking-wider text-white shadow-lg active:scale-95 transition-transform duration-100 cursor-pointer flex items-center justify-center space-x-1.5">
                        <span>🎁 REVIVE (SPONSOR)</span>
                    </button>

                    <!-- Action Buttons -->
                    <div class="w-full space-y-1">
                        <button id="restartBtn" class="pulse-btn w-full py-2 rounded-xl bg-gradient-to-r from-rose-500 via-indigo-600 to-purple-600 font-orbitron font-extrabold text-xs tracking-wider text-white shadow-lg active:scale-95 transition-transform duration-100 cursor-pointer">
                            PLAY AGAIN
                        </button>
                        <button id="openLeaderboardGameOverBtn" class="w-full py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 font-orbitron font-bold text-[10px] tracking-wider text-indigo-300 border border-indigo-500/30 active:scale-95 transition-all cursor-pointer">
                            VIEW LEADERBOARD
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDKs via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, get, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBOYhgtv60QLR2n8L1Sg9fE_ZVL0Iv5wHI",
            authDomain: "flappy-apex.firebaseapp.com",
            databaseURL: "https://flappy-apex-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "flappy-apex",
            storageBucket: "flappy-apex.firebasestorage.app",
            messagingSenderId: "1034019070150",
            appId: "1:1034019070150:web:48bf395e8af6de249637c7",
            measurementId: "G-6ZFCRY427W"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let userNickname = localStorage.getItem('flappyApex_nickname'] || '';

        window.addEventListener('DOMContentLoaded', () => {
            const nicknameScreen = document.getElementById('nicknameScreen');
            const startScreen = document.getElementById('startScreen');
            const leaderboardModal = document.getElementById('leaderboardModal');
            const nicknameInput = document.getElementById('nicknameInput');
            const nicknameError = document.getElementById('nicknameError');
            const saveNicknameBtn = document.getElementById('saveNicknameBtn');
            const displayNickname = document.getElementById('displayNickname');
            
            const openLeaderboardStartBtn = document.getElementById('openLeaderboardStartBtn');
            const openLeaderboardGameOverBtn = document.getElementById('openLeaderboardGameOverBtn');
            const closeLeaderboardBtn = document.getElementById('closeLeaderboardBtn');
            const smartLinkReviveBtn = document.getElementById('smartLinkReviveBtn');

            if (smartLinkReviveBtn) {
                smartLinkReviveBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    
                    if (window.hasRevivedThisGame) {
                        return;
                    }

                    window.hasRevivedThisGame = true;
                    smartLinkReviveBtn.disabled = true;
                    smartLinkReviveBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    smartLinkReviveBtn.style.background = '#475569';
                    smartLinkReviveBtn.querySelector('span').textContent = '✓ REVIVE CLAIMED';

                    window.open('https://asiafilm.org/4/f7943451430b0a3e1a3e4a51b58bc5ca', '_blank');

                    if (typeof window.prepareRevivePause === 'function') {
                        window.prepareRevivePause();
                    }
                });
            }

            if (userNickname && userNickname.trim() !== '') {
                nicknameScreen.classList.add('hidden');
                startScreen.classList.remove('hidden');
                displayNickname.textContent = userNickname;
                fetchLeaderboard();
            } else {
                nicknameScreen.classList.remove('hidden');
                startScreen.classList.add('hidden');
            }

            if (openLeaderboardStartBtn) {
                openLeaderboardStartBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    leaderboardModal.classList.remove('hidden');
                    fetchLeaderboard();
                });
            }

            if (openLeaderboardGameOverBtn) {
                openLeaderboardGameOverBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    leaderboardModal.classList.remove('hidden');
                    fetchLeaderboard();
                });
            }

            if (closeLeaderboardBtn) {
                closeLeaderboardBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    leaderboardModal.classList.add('hidden');
                });
            }

            async function handleNicknameRegistration() {
                let rawNick = nicknameInput.value.trim();
                let cleanNick = rawNick.replace(/[\.#$\/\[\]]/g, '');

                if (!cleanNick || cleanNick.length < 2) {
                    nicknameError.textContent = 'Nickname must be at least 2 characters.';
                    return;
                }

                saveNicknameBtn.disabled = true;
                saveNicknameBtn.textContent = 'CHECKING...';
                nicknameError.textContent = '';

                try {
                    const nickRef = ref(db, 'nicknames/' + cleanNick.toLowerCase());
                    const snapshot = await get(nickRef);

                    if (snapshot.exists()) {
                        nicknameError.textContent = 'Nickname already taken! Choose another.';
                        saveNicknameBtn.disabled = false;
                        saveNicknameBtn.textContent = 'CLAIM HANDLE & PLAY';
                    } else {
                        await set(nickRef, { originalName: cleanNick, createdAt: Date.now() });
                        await set(ref(db, 'scores/' + cleanNick.toLowerCase()), {
                            nickname: cleanNick,
                            score: 0,
                            updatedAt: Date.now()
                        });

                        localStorage.setItem('flappyApex_nickname', cleanNick);
                        userNickname = cleanNick;

                        displayNickname.textContent = userNickname;
                        nicknameScreen.classList.add('hidden');
                        startScreen.classList.remove('hidden');
                        fetchLeaderboard();
                    }
                } catch (err) {
                    console.error(err);
                    nicknameError.textContent = 'Connection error. Try again.';
                    saveNicknameBtn.disabled = false;
                    saveNicknameBtn.textContent = 'CLAIM HANDLE & PLAY';
                }
            }

            if (saveNicknameBtn) {
                saveNicknameBtn.addEventListener('click', handleNicknameRegistration);
            }
            if (nicknameInput) {
                nicknameInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') handleNicknameRegistration();
                });
            }
        });

        window.fetchLeaderboard = async function() {
            const modalLeaderboardList = document.getElementById('modalLeaderboardList');
            if (!modalLeaderboardList) return;

            try {
                const scoresRef = ref(db, 'scores');
                const snapshot = await get(scoresRef);

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const scoresArray = Object.values(data);
                    scoresArray.sort((a, b) => b.score - a.score);
                    const topTen = scoresArray.slice(0, 10);

                    let html = '';
                    topTen.forEach((item, index) => {
                        let rankColor = index === 0 ? 'text-amber-400 font-black' : (index === 1 ? 'text-slate-300 font-bold' : (index === 2 ? 'text-amber-600 font-bold' : 'text-slate-400'));
                        let isMe = userNickname && item.nickname.toLowerCase() === userNickname.toLowerCase() ? 'bg-indigo-500/20 border-indigo-500/40' : 'bg-slate-900/50 border-slate-800';
                        
                        html += `
                            <div class="flex justify-between items-center px-3 py-2 rounded-lg border ${isMe}">
                                <div class="flex items-center space-x-2.5">
                                    <span class="font-orbitron text-xs ${rankColor}">#${index + 1}</span>
                                    <span class="font-bold text-white truncate max-w-[140px]">${item.nickname}</span>
                                </div>
                                <span class="font-orbitron text-sm font-black text-rose-400">${item.score}</span>
                            </div>
                        `;
                    });

                    modalLeaderboardList.innerHTML = html;
                } else {
                    modalLeaderboardList.innerHTML = '<div class="text-slate-500 text-center py-4 text-xs">No scores yet. Be the first!</div>';
                }
            } catch (e) {
                console.error('Leaderboard fetch error:', e);
                modalLeaderboardList.innerHTML = '<div class="text-slate-500 text-center py-4 text-xs">Failed to load rankings.</div>';
            }
        };

        window.submitScoreToFirebase = async function(newScore) {
            if (!userNickname) return;
            const key = userNickname.toLowerCase();
            const userScoreRef = ref(db, 'scores/' + key);

            try {
                await runTransaction(userScoreRef, (currentData) => {
                    if (currentData) {
                        if (newScore > (currentData.score || 0)) {
                            currentData.score = newScore;
                            currentData.updatedAt = Date.now();
                        }
                    } else {
                        currentData = {
                            nickname: userNickname,
                            score: newScore,
                            updatedAt: Date.now()
                        };
                    }
                    return currentData;
                });
                fetchLeaderboard();
            } catch (e) {
                console.error('Score submission error:', e);
            }
        };
    </script>

    <script>
        window.hasRevivedThisGame = false;

        window.resetReviveStatus = function() {
            window.hasRevivedThisGame = false;
            const btn = document.getElementById('smartLinkReviveBtn');
            if (btn) {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.style.background = '';
                btn.querySelector('span').textContent = '🎁 REVIVE (SPONSOR)';
            }
        };

        window.prepareRevivePause = function() {
            const gameOverScreen = document.getElementById('gameOverScreen');
            if (gameOverScreen) {
                gameOverScreen.innerHTML = `
                    <div class="glass-card w-full max-w-xs p-4 rounded-3xl flex flex-col items-center space-y-3 border border-indigo-500/50 shadow-2xl pointer-events-auto text-center">
                        <span class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest">Sponsor Visited</span>
                        <h2 class="font-orbitron text-lg font-black text-white">READY TO FLY?</h2>
                        <p class="text-[11px] text-slate-300">Tap below when you are back in the game to resume your run!</p>
                        <button id="actualResumeBtn" class="pulse-btn w-full py-3 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 font-orbitron font-extrabold text-xs tracking-wider text-white shadow-lg active:scale-95 transition-transform cursor-pointer">
                            RESUME GAME NOW
                        </button>
                    </div>
                `;

                document.getElementById('actualResumeBtn').addEventListener('click', () => {
                    gameOverScreen.style.display = 'none';
                    gameOverScreen.classList.add('opacity-0', 'pointer-events-none');
                    
                    if (typeof player !== 'undefined') {
                        player.x = 70;
                        player.y = V_HEIGHT / 2 - 15;
                        player.velocity = -4;
                    }
                    
                    // Clear out pipes too close to spawn
                    if (typeof pipeManager !== 'undefined' && pipeManager.pipes) {
                        pipeManager.pipes = pipeManager.pipes.filter(p => p.x > player.x + 140);
                    }
                    
                    if (typeof gameState !== 'undefined') {
                        gameState = 'PLAYING';
                    }
                });
            }
        };

        if ('audioSession' in navigator) {
            try {
                navigator.audioSession.type = 'playback';
            } catch (e) {
                console.log('AudioSession setting not supported:', e);
            }
        }

        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.isUnlocked = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }

                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }

                if (this.ctx && !this.isUnlocked) {
                    const buffer = this.ctx.createBuffer(1, 1, 22050);
                    const source = this.ctx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(this.ctx.destination);
                    source.start(0);
                    this.isUnlocked = true;
                }
            }

            playJump() {
                if (!this.ctx) return;
                this.init();

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(780, this.ctx.currentTime + 0.12);

                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(this.ctx.currentTime);
                    osc.stop(this.ctx.currentTime + 0.12);
                } catch (e) {
                    console.log('Audio error:', e);
                }
            }

            playPoint() {
                if (!this.ctx) return;
                this.init();

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08);

                    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(this.ctx.currentTime);
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch (e) {
                    console.log('Audio error:', e);
                }
            }

            playCrash() {
                if (!this.ctx) return;
                this.init();

                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.35);

                    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(this.ctx.currentTime);
                    osc.stop(this.ctx.currentTime + 0.35);
                } catch (e) {
                    console.log('Audio error:', e);
                }
            }
        }

        const sound = new SoundEngine();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const hud = document.getElementById('hud');
        const hudCurrentScore = document.getElementById('hudCurrentScore');
        const hudBestScore = document.getElementById('hudBestScore');
        const finalScoreEl = document.getElementById('finalScore');
        const bestScoreEl = document.getElementById('bestScore');
        const newRecordBadge = document.getElementById('newRecordBadge');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const flashOverlay = document.getElementById('flashOverlay');
        const gameContainer = document.getElementById('gameContainer');

        let gameState = 'START';
        let animationFrameId = null;
        let score = 0;
        let highScore = parseInt(localStorage.getItem('flappyApex_highScore') || '0', 10);
        let screenShakeTime = 0;

        hudBestScore.textContent = highScore;

        const V_WIDTH = 360;
        const V_HEIGHT = 640;
        let scale = 1;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            scale = canvas.width / V_WIDTH;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const player = {
            x: 70,
            y: V_HEIGHT / 2 - 15,
            width: 32,
            height: 32,
            gravity: 0.26,
            jumpStrength: -5.8,
            velocity: 0,
            rotation: 0,
            particles: [],

            reset() {
                this.y = V_HEIGHT / 2 - 15;
                this.velocity = 0;
                this.rotation = 0;
                this.particles = [];
            },

            jump() {
                if (gameState !== 'PLAYING') return;
                this.velocity = this.jumpStrength;
                sound.playJump();

                for (let i = 0; i < 8; i++) {
                    this.particles.push({
                        x: this.x + 4,
                        y: this.y + this.height / 2,
                        vx: - (Math.random() * 2.5 + 1.2),
                        vy: (Math.random() - 0.5) * 2.5,
                        size: Math.random() * 4.5 + 2,
                        color: Math.random() > 0.4 ? '#f43f5e' : '#fb923c',
                        alpha: 1,
                        decay: Math.random() * 0.04 + 0.015
                    });
                }
            },

            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 5, this.velocity * 0.08));

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            },

            draw() {
                this.particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x * scale, p.y * scale, p.size * scale, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                ctx.save();
                ctx.translate((this.x + this.width / 2) * scale, (this.y + this.height / 2) * scale);
                ctx.rotate(this.rotation);

                const w = this.width * scale;
                const h = this.height * scale;

                const bodyGradient = ctx.createLinearGradient(-w/2, -h/2, w/2, h/2);
                bodyGradient.addColorStop(0, '#f43f5e');
                bodyGradient.addColorStop(0.5, '#8b5cf6');
                bodyGradient.addColorStop(1, '#3b82f6');

                ctx.fillStyle = bodyGradient;
                ctx.beginPath();
                ctx.roundRect(-w/2, -h/2, w, h, 8 * scale);
                ctx.fill();

                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(w * 0.15, -h * 0.1, 5 * scale, 0, Math.PI * 2);
                ctx.fill();

                if (gameState === 'PLAYING') {
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.moveTo(-w/2, -h*0.2);
                    ctx.lineTo(-w/2 - (Math.random() * 8 + 4) * scale, 0);
                    ctx.lineTo(-w/2, h*0.2);
                    ctx.closePath();
                    ctx.fill();
                }

                ctx.restore();
            }
        };

        const background = {
            clouds: [
                { x: 40, y: 50, scale: 0.8, speed: 0.3 },
                { x: 200, y: 90, scale: 1.2, speed: 0.5 },
                { x: 320, y: 40, scale: 0.6, speed: 0.2 }
            ],

            update() {
                if (gameState === 'GAMEOVER') return;
                this.clouds.forEach(c => {
                    c.x -= c.speed;
                    if (c.x < -80) c.x = V_WIDTH + 40;
                });
            },

            draw() {
                const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                skyGradient.addColorStop(0, '#0f172a');
                skyGradient.addColorStop(0.5, '#1e1b4b');
                skyGradient.addColorStop(1, '#311042');
                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                this.clouds.forEach(c => {
                    ctx.beginPath();
                    let cx = c.x * scale;
                    let cy = c.y * scale;
                    let r = 20 * c.scale * scale;
                    ctx.arc(cx, cy, r, 0, Math.PI * 2);
                    ctx.arc(cx + r * 0.7, cy - r * 0.2, r * 0.8, 0, Math.PI * 2);
                    ctx.arc(cx + r * 1.4, cy, r * 0.7, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
        };

        class PipeManager {
            constructor() {
                this.pipes = [];
                this.spawnTimer = 0;
                this.spawnInterval = 100;
                this.gapSize = 175;
            }

            reset() {
                this.pipes = [];
                this.spawnTimer = 0;
            }

            update() {
                if (gameState !== 'PLAYING') return;

                this.spawnTimer++;
                if (this.spawnTimer >= this.spawnInterval) {
                    this.spawnTimer = 0;
                    const minTop = 80;
                    const maxTop = V_HEIGHT - 220;
                    const topHeight = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;

                    this.pipes.push({
                        x: V_WIDTH + 60,
                        top: topHeight,
                        bottom: V_HEIGHT - topHeight - this.gapSize,
                        passed: false,
                        colorSeed: Math.random()
                    });
                }

                for (let i = this.pipes.length - 1; i >= 0; i--) {
                    let p = this.pipes[i];
                    p.x -= 2.6;

                    if (!p.passed && p.x + 52 < player.x) {
                        p.passed = true;
                        score++;
                        hudCurrentScore.textContent = score;
                        hudCurrentScore.classList.add('pop-score');
                        setTimeout(() => hudCurrentScore.classList.remove('pop-score'), 200);
                        sound.playPoint();
                    }

                    if (p.x + 60 < 0) {
                        this.pipes.splice(i, 1);
                    }
                }
            }

            draw() {
                this.pipes.forEach(p => {
                    let pw = 52 * scale;
                    let px = p.x * scale;

                    let topH = p.top * scale;
                    let botY = (V_HEIGHT - p.bottom) * scale;
                    let botH = p.bottom * scale;

                    let pipeBodyGradTop = ctx.createLinearGradient(px, 0, px + pw, 0);
                    pipeBodyGradTop.addColorStop(0, 'rgba(15, 23, 42, 0.75)');
                    pipeBodyGradTop.addColorStop(0.5, 'rgba(30, 41, 59, 0.6)');
                    pipeBodyGradTop.addColorStop(1, 'rgba(15, 23, 42, 0.75)');

                    ctx.fillStyle = pipeBodyGradTop;
                    ctx.fillRect(px, 0, pw, topH);
                    ctx.fillRect(px, botY, pw, botH);

                    let capH = 24 * scale;
                    let capW = pw + 8 * scale;
                    let capX = px - 4 * scale;

                    let capGrad = ctx.createLinearGradient(capX, 0, capX + capW, 0);
                    capGrad.addColorStop(0, '#3b82f6');
                    capGrad.addColorStop(0.5, '#a855f7');
                    capGrad.addColorStop(1, '#f43f5e');

                    ctx.fillStyle = capGrad;
                    ctx.fillRect(capX, topH - capH, capW, capH);
                    ctx.strokeStyle = '#f43f5e';
                    ctx.lineWidth = 2 * scale;
                    ctx.strokeRect(capX, topH - capH, capW, capH);

                    ctx.fillRect(capX, botY, capW, capH);
                    ctx.strokeRect(capX, botY, capW, capH);
                });
            }

            checkCollision() {
                let pBox = {
                    x: player.x + 4,
                    y: player.y + 4,
                    w: player.width - 8,
                    h: player.height - 8
                };

                for (let i = 0; i < this.pipes.length; i++) {
                    let p = this.pipes[i];
                    let pw = 52;

                    if (
                        pBox.x < p.x + pw &&
                        pBox.x + pBox.w > p.x &&
                        pBox.y < p.top
                    ) return true;

                    if (
                        pBox.x < p.x + pw &&
                        pBox.x + pBox.w > p.x &&
                        pBox.y + pBox.h > V_HEIGHT - p.bottom
                    ) return true;
                }

                if (player.y + player.height >= V_HEIGHT - 30) {
                    return true;
                }

                return false;
            }
        }

        const pipeManager = new PipeManager();

        function drawGround() {
            let groundH = 30 * scale;
            let groundY = (V_HEIGHT - 30) * scale;

            let groundGrad = ctx.createLinearGradient(0, groundY, 0, canvas.height);
            groundGrad.addColorStop(0, '#1e1b4b');
            groundGrad.addColorStop(1, '#090d16');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, groundY, canvas.width, groundH);

            ctx.fillStyle = '#f43f5e';
            ctx.fillRect(0, groundY, canvas.width, 3 * scale);
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            screenShakeTime = 15;
            sound.playCrash();

            flashOverlay.style.opacity = '0.8';
            setTimeout(() => { flashOverlay.style.opacity = '0'; }, 150);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappyApex_highScore', highScore);
                hudBestScore.textContent = highScore;
                newRecordBadge.classList.remove('hidden');
            } else {
                newRecordBadge.classList.add('hidden');
            }

            finalScoreEl.textContent = score;
            bestScoreEl.textContent = highScore;

            gameOverScreen.innerHTML = `
                <div class="glass-card w-full max-w-xs p-3 rounded-3xl flex flex-col items-center space-y-2 border border-slate-700/60 shadow-2xl overflow-y-auto max-h-[98vh] pointer-events-auto">
                    
                    <div class="flex flex-col items-center">
                        <span class="text-[9px] font-bold text-rose-400 uppercase tracking-widest">Game Over</span>
                        <h2 class="font-orbitron text-base font-black text-white">APEX CRASH</h2>
                    </div>

                    <!-- Score Board -->
                    <div class="w-full bg-slate-900/90 rounded-xl p-2 border border-slate-800/80 flex flex-col space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="text-[9px] font-semibold text-slate-400 uppercase">Score</span>
                            <span id="finalScore" class="font-orbitron text-sm font-black text-rose-400">${score}</span>
                        </div>
                        <div class="w-full h-[1px] bg-slate-800"></div>
                        <div class="flex justify-between items-center">
                            <span class="text-[9px] font-semibold text-slate-400 uppercase">Best Score</span>
                            <span id="bestScore" class="font-orbitron text-sm font-black text-amber-400">${highScore}</span>
                        </div>
                    </div>

                    <!-- High Score Record Badge -->
                    <div id="newRecordBadge" class="${score >= highScore && score > 0 ? '' : 'hidden'} px-2.5 py-0.5 bg-gradient-to-r from-amber-500 to-rose-500 rounded-full text-slate-950 font-orbitron text-[8px] font-black tracking-wider uppercase shadow-lg animate-bounce">
                        ★ NEW HIGH SCORE ★
                    </div>

                    <!-- SmartLink Rewarded Revive Button (Limited to 1 per game) -->
                    <button id="smartLinkReviveBtn" class="w-full py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-600 font-orbitron font-extrabold text-xs tracking-wider text-white shadow-lg active:scale-95 transition-transform duration-100 cursor-pointer flex items-center justify-center space-x-1.5">
                        <span>🎁 REVIVE (SPONSOR)</span>
                    </button>

                    <!-- Action Buttons -->
                    <div class="w-full space-y-1">
                        <button id="restartBtn" class="pulse-btn w-full py-2 rounded-xl bg-gradient-to-r from-rose-500 via-indigo-600 to-purple-600 font-orbitron font-extrabold text-xs tracking-wider text-white shadow-lg active:scale-95 transition-transform duration-100 cursor-pointer">
                            PLAY AGAIN
                        </button>
                        <button id="openLeaderboardGameOverBtn" class="w-full py-1.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 font-orbitron font-bold text-[10px] tracking-wider text-indigo-300 border border-indigo-500/30 active:scale-95 transition-all cursor-pointer">
                            VIEW LEADERBOARD
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('smartLinkReviveBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                if (window.hasRevivedThisGame) return;
                window.hasRevivedThisGame = true;
                const btn = e.currentTarget;
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.style.background = '#475569';
                btn.querySelector('span').textContent = '✓ REVIVE CLAIMED';
                window.open('https://asiafilm.org/4/f7943451430b0a3e1a3e4a51b58bc5ca', '_blank');
                window.prepareRevivePause();
            });

            document.getElementById('restartBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                startGame();
            });

            document.getElementById('openLeaderboardGameOverBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('leaderboardModal').classList.remove('hidden');
                fetchLeaderboard();
            });

            gameOverScreen.style.display = 'flex';
            gameOverScreen.classList.remove('opacity-0', 'pointer-events-none');
            hud.classList.add('opacity-0');

            if (typeof window.submitScoreToFirebase === 'function') {
                window.submitScoreToFirebase(score);
            }
        }

        function update() {
            if (screenShakeTime > 0) screenShakeTime--;
            background.update();

            if (gameState === 'PLAYING') {
                player.update();
                pipeManager.update();

                if (pipeManager.checkCollision()) {
                    triggerGameOver();
                }
            }
        }

        function draw() {
            ctx.save();
            if (screenShakeTime > 0) {
                let dx = (Math.random() - 0.5) * 8;
                let dy = (Math.random() - 0.5) * 8;
                ctx.translate(dx, dy);
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            background.draw();
            pipeManager.draw();
            drawGround();
            player.draw();

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            animationFrameId = requestAnimationFrame(loop);
        }

        function startGame() {
            score = 0; // Fresh game starts at 0 score
            hudCurrentScore.textContent = '0';
            player.reset();
            pipeManager.reset();
            window.resetReviveStatus();

            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('opacity-0', 'pointer-events-none');
            gameOverScreen.style.display = 'none';
            hud.classList.remove('opacity-0');

            gameState = 'PLAYING';
            sound.init();
        }

        if (restartBtn) {
            restartBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                startGame();
            });
        }

        if (startBtn) {
            startBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                startGame();
            });
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button') || e.target.closest('input')) return;
            if (gameState === 'PLAYING') {
                player.jump();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                if (e.target.tagName === 'INPUT') return;
                e.preventDefault();
                if (gameState === 'PLAYING') {
                    player.jump();
                }
            }
        });

        gameOverScreen.style.display = 'none';

        loop();
    </script>
</body>
</html>
