<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Apex</title>

  <!-- Monetag Ad Script (Zone 11996011) -->
  <script>(function(s){s.dataset.zone='11996011',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

  <!-- Firebase App & Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0f1115;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Mobile / Non-PC Blocker Overlay */
    #mobile-blocker {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #090a0f;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    #mobile-blocker h1 {
      color: #ff4655;
      font-size: 28px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #mobile-blocker p {
      color: #a0a5b5;
      font-size: 16px;
      max-width: 400px;
      line-height: 1.5;
    }

    /* Main Container */
    #game-container {
      position: relative;
      width: 800px;
      height: 500px;
      border: 3px solid #1f2330;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      background: #141721;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* UI Overlay Screens */
    .overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 17, 21, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .title {
      font-size: 42px;
      font-weight: 800;
      color: #ff4655;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(255, 70, 85, 0.4);
    }

    .subtitle {
      font-size: 16px;
      color: #8b92a5;
      margin-bottom: 25px;
    }

    /* Auth & Login Inputs */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 280px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      padding: 12px 16px;
      border-radius: 6px;
      border: 2px solid #2a2e3d;
      background: #0b0c10;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
    }

    input[type="text"]:focus {
      border-color: #ff4655;
    }

    .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: #ff4655;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover {
      background: #e03e4d;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .error-msg {
      color: #ff4655;
      font-size: 14px;
      margin-top: 8px;
      min-height: 20px;
    }

    /* Leaderboard Drawer */
    #leaderboard-box {
      width: 280px;
      max-height: 180px;
      overflow-y: auto;
      background: #0b0c10;
      border: 1px solid #2a2e3d;
      border-radius: 6px;
      margin-top: 15px;
      padding: 10px;
    }

    .lb-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 10px;
      font-size: 14px;
      border-bottom: 1px solid #1a1d26;
    }

    .lb-row:last-child {
      border-bottom: none;
    }

    .lb-rank {
      color: #ff4655;
      font-weight: bold;
    }

    .lb-name {
      color: #d1d5db;
    }

    .lb-score {
      color: #4ade80;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Desktop Only Blocker Overlay -->
  <div id="mobile-blocker">
    <h1>Desktop / PC Only</h1>
    <p>Flappy Apex is designed strictly for PC devices. Please open this link on a desktop or laptop computer to play.</p>
  </div>

  <!-- Main Game Container -->
  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <!-- Login / Registration Screen -->
    <div id="login-screen" class="overlay-screen">
      <div class="title">Flappy Apex</div>
      <div class="subtitle">Enter a Unique Username to Claim Your Device Account</div>
      <div class="input-group">
        <input type="text" id="username-input" placeholder="Enter Username..." maxlength="15" autocomplete="off">
        <button class="btn" onclick="registerUser()">Start Game</button>
      </div>
      <div id="login-error" class="error-msg"></div>
    </div>

    <!-- Start / Game Over Screen -->
    <div id="menu-screen" class="overlay-screen" style="display: none;">
      <div class="title" id="menu-title">Flappy Apex</div>
      <div class="subtitle" id="menu-subtitle">Press Space or Click to Jump!</div>
      <button class="btn" onclick="startGame()">Play Game</button>
      
      <div id="leaderboard-box">
        <div style="text-align: center; font-size: 12px; color: #6b7280; margin-bottom: 8px; text-transform: uppercase;">Top Pilot Leaderboard</div>
        <div id="lb-list">Loading scores...</div>
      </div>
    </div>
  </div>

  <script>
    // --- 1. DEVICE BLOCKER ENFORCEMENT ---
    function checkDevice() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
      if (isMobile) {
        document.getElementById("mobile-blocker").style.display = "flex";
      } else {
        document.getElementById("mobile-blocker").style.display = "none";
      }
    }
    window.addEventListener("resize", checkDevice);
    checkDevice();

    // --- 2. FIREBASE CONFIGURATION & INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let db = null;
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch(e) {
      console.warn("Firebase config not populated yet or running offline mode.");
    }

    // Unique Device Fingerprint / Storage Key
    function getDeviceId() {
      let devId = localStorage.getItem("flappy_apex_device_id");
      if (!devId) {
        devId = "DEV-" + Math.random().toString(36).substring(2, 11) + "-" + Date.now();
        localStorage.setItem("flappy_apex_device_id", devId);
      }
      return devId;
    }

    const currentDeviceId = getDeviceId();
    let currentUsername = localStorage.getItem("flappy_apex_username") || null;

    // Fast-track user if already registered on this device
    window.addEventListener("DOMContentLoaded", () => {
      if (currentUsername) {
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("menu-screen").style.display = "flex";
        loadLeaderboard();
      }
    });

    function registerUser() {
      const input = document.getElementById("username-input").value.trim();
      const errorDiv = document.getElementById("login-error");
      errorDiv.innerText = "";

      if (input.length < 3) {
        errorDiv.innerText = "Username must be at least 3 characters.";
        return;
      }

      if (!db) {
        currentUsername = input;
        localStorage.setItem("flappy_apex_username", currentUsername);
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("menu-screen").style.display = "flex";
        return;
      }

      // Check unique username in Firebase
      db.ref("users").orderByChild("usernameLower").equalTo(input.toLowerCase()).once("value", (snapshot) => {
        if (snapshot.exists()) {
          let takenByOther = false;
          snapshot.forEach((child) => {
            if (child.key !== currentDeviceId) {
              takenByOther = true;
            }
          });

          if (takenByOther) {
            errorDiv.innerText = "Username already taken by another device!";
            return;
          }
        }

        db.ref("users/" + currentDeviceId).set({
          username: input,
          usernameLower: input.toLowerCase(),
          registeredAt: Date.now()
        }).then(() => {
          currentUsername = input;
          localStorage.setItem("flappy_apex_username", currentUsername);
          document.getElementById("login-screen").style.display = "none";
          document.getElementById("menu-screen").style.display = "flex";
          loadLeaderboard();
        }).catch((err) => {
          errorDiv.innerText = "Error saving profile. Try again.";
        });
      });
    }

    function saveScore(score) {
      if (!db || !currentUsername) return;
      db.ref("leaderboard/" + currentDeviceId).once("value", (snapshot) => {
        const existing = snapshot.val();
        if (!existing || score > existing.score) {
          db.ref("leaderboard/" + currentDeviceId).set({
            username: currentUsername,
            score: score,
            timestamp: Date.now()
          }).then(() => {
            loadLeaderboard();
          });
        }
      });
    }

    function loadLeaderboard() {
      if (!db) {
        document.getElementById("lb-list").innerHTML = "<div class='lb-row'><span>Offline Mode</span></div>";
        return;
      }

      db.ref("leaderboard").orderByChild("score").limitToLast(10).once("value", (snapshot) => {
        const listDiv = document.getElementById("lb-list");
        listDiv.innerHTML = "";

        let scores = [];
        snapshot.forEach((child) => {
          scores.push(child.val());
        });
        scores.reverse();

        if (scores.length === 0) {
          listDiv.innerHTML = "<div class='lb-row' style='justify-content:center; color:#6b7280;'>No highscores yet!</div>";
          return;
        }

        scores.forEach((item, index) => {
          const row = document.createElement("div");
          row.className = "lb-row";
          row.innerHTML = `
            <span class="lb-rank">#${index + 1}</span>
            <span class="lb-name">${escapeHtml(item.username)}</span>
            <span class="lb-score">${item.score}</span>
          `;
          listDiv.appendChild(row);
        });
      });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // --- 3. FLAPPY APEX GAME ENGINE ---
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let gameState = "MENU"; // MENU, PLAYING, GAMEOVER
    let score = 0;
    let frame = 0;

    const bird = {
      x: 120,
      y: 250,
      width: 32,
      height: 32,
      gravity: 0.45,
      lift: -8.5,
      velocity: 0
    };

    let pipes = [];
    const pipeWidth = 60;
    const pipeGap = 140;

    function resetGame() {
      bird.y = 250;
      bird.velocity = 0;
      pipes = [];
      score = 0;
      frame = 0;
    }

    function startGame() {
      resetGame();
      gameState = "PLAYING";
      document.getElementById("menu-screen").style.display = "none";
    }

    function gameOver() {
      gameState = "GAMEOVER";
      saveScore(score);
      document.getElementById("menu-title").innerText = "Game Over";
      document.getElementById("menu-subtitle").innerText = `Final Score: ${score}`;
      document.getElementById("menu-screen").style.display = "flex";
    }

    function jump() {
      if (gameState === "PLAYING") {
        bird.velocity = bird.lift;
      }
    }

    // Controls
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        jump();
      }
    });

    canvas.addEventListener("mousedown", () => {
      jump();
    });

    // Game Loop
    function update() {
      if (gameState !== "PLAYING") return;

      frame++;
      bird.velocity += bird.gravity;
      bird.y += bird.velocity;

      // Floor & Ceiling collision
      if (bird.y + bird.height >= canvas.height || bird.y <= 0) {
        gameOver();
      }

      // Pipe Spawning
      if (frame % 90 === 0) {
        const topHeight = Math.floor(Math.random() * (canvas.height - pipeGap - 100)) + 40;
        pipes.push({
          x: canvas.width,
          top: topHeight,
          bottom: canvas.height - topHeight - pipeGap,
          passed: false
        });
      }

      // Move Pipes & Check Collisions
      for (let i = pipes.length - 1; i >= 0; i--) {
        pipes[i].x -= 3;

        // Collision Check
        if (
          bird.x < pipes[i].x + pipeWidth &&
          bird.x + bird.width > pipes[i].x &&
          (bird.y < pipes[i].top || bird.y + bird.height > canvas.height - pipes[i].bottom)
        ) {
          gameOver();
        }

        // Score Increase
        if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
          pipes[i].passed = true;
          score++;
        }

        // Remove Off-Screen Pipes
        if (pipes[i].x + pipeWidth < 0) {
          pipes.splice(i, 1);
        }
      }
    }

    function render() {
      // Background
      ctx.fillStyle = "#141721";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Line Accents
      ctx.strokeStyle = "#1f2330";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      // Draw Pipes
      pipes.forEach((p) => {
        ctx.fillStyle = "#ff4655";
        ctx.fillRect(p.x, 0, pipeWidth, p.top);
        ctx.fillRect(p.x, canvas.height - p.bottom, pipeWidth, p.bottom);
      });

      // Draw Player (Apex Flyer Icon)
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(bird.x, bird.y, bird.width, bird.height);

      // Score Display
      if (gameState === "PLAYING") {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 28px 'Segoe UI', sans-serif";
        ctx.fillText(`Score: ${score}`, 20, 40);
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
